[project]
name = "erp-mcp"
version = "0.1.0"
description = "MCP server ket noi Claude Code voi ERPNext/Frappe qua REST API"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
